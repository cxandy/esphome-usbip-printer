name: Build ESPHome firmware

on:
  # 手动触发，可选择要编译的配置文件
  workflow_dispatch:
    inputs:
      config:
        description: "ESPHome config to build"
        required: false
        default: "usbip_config.yaml"
  # 推送时自动触发（只在这些文件变化时）
  push:
    paths:
      - "usbip_config.yaml"
      - "usbip_mfc7420.example.yaml"
      - "components/**"
      - "tools/usbip-client/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ESPHome
        run: pip install esphome

      - name: Compile firmware
        run: esphome compile "${{ github.event.inputs.config || 'usbip_config.yaml' }}"

      - name: Collect firmware binaries
        run: |
          mkdir -p artifacts
          find . -path "*build/*" -name "*.bin" -exec cp {} artifacts/ \;
          ls -la artifacts/

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: error

  # Build the Windows GUI client exe and commit it back to the repo,
  # so end users can download it directly without any build step.
  build-client:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile USBIP-Client.exe
        shell: pwsh
        run: |
          & "$env:windir\Microsoft.NET\Framework64\v4.0.30319\csc.exe" `
            /nologo /target:winexe /platform:anycpu /langversion:5 `
            /win32manifest:tools/usbip-client/src/app.manifest `
            /codepage:65001 `
            /out:tools/usbip-win-0.3.6-dev/USBIP-Client.exe `
            tools/usbip-client/src/usbip-client.cs
          Get-Item tools/usbip-win-0.3.6-dev/USBIP-Client.exe | Format-List Name, Length

      - name: Commit exe back to the repo
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/usbip-win-0.3.6-dev/USBIP-Client.exe
          if (git diff --cached --quiet) {
            Write-Host "No change in the exe, skipping commit"
          } else {
            git commit -m "ci: rebuild USBIP-Client.exe [skip ci]"
            git push
          }
